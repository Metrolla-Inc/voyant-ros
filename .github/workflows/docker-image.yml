name: Docker Build and Push

on:
  push:
    branches:
      - main
      - 'v*'
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build-and-push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft != true }}

    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, iron, rolling, jazzy]
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp]
        exclude:
          - ros_distro: iron
            rmw: rmw_fastrtps_cpp
          - ros_distro: iron
            rmw: rmw_cyclonedds_cpp

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner and repo name
        id: repo
        run: |
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute sanitized Docker tag
        id: tag
        shell: bash
        run: |
          REF_NAME="${{ github.ref_name }}"
          # replace "/" with "-", lowercase, and collapse any disallowed characters
          SAFE_TAG="${REF_NAME//\//-}"
          SAFE_TAG="${SAFE_TAG,,}"
          SAFE_TAG="$(echo "$SAFE_TAG" | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
          
          # Append matrix info to tag
          FULL_TAG="${SAFE_TAG}-${{ matrix.ros_distro }}-${{ matrix.rmw }}"
          echo "tag=$FULL_TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $FULL_TAG"

      - name: Build and push Docker image for multiple platforms
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            ROS_DISTRO=${{ matrix.ros_distro }}
            RMW_IMPLEMENTATION=${{ matrix.rmw }}
          tags: ghcr.io/${{ steps.repo.outputs.repo }}:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repo }}:latest-${{ matrix.ros_distro }}-${{ matrix.rmw }}
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.repo }}:latest-${{ matrix.ros_distro }}-${{ matrix.rmw }},mode=max
