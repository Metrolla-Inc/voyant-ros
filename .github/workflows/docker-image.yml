name: Docker Build and Push

# Images are pushed for version tags only (v*), never for a branch or a pull request, and a tag
# that already exists in the registry is never overwritten (tags are immutable). The image is
# built from the tagged commit. Pull requests build the same image for both platforms (natively,
# one runner each) without logging in and without pushing.
# What changed from the previous workflow: pushes to main and to branches named v* no longer push
# ghcr.io/metrolla-inc/voyant-ros:<branch>-jazzy-rmw_fastrtps_cpp; the image tag is the git tag
# alone (as the other driver images; no image of this fork was ever pushed, every run failed);
# the :latest-... registry cache is no longer read or written; actions are pinned by sha; the
# vendor's pre-commit job (which failed on every run) is no longer part of the image build. A tag
# push still pushes for linux/amd64 and linux/arm64 with this run's GITHUB_TOKEN, and now also
# records the image digest.

on:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.platform }} (pull request, not pushed)
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build (no push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          platforms: ${{ matrix.platform }}
          build-args: |
            ROS_DISTRO=jazzy
            RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          tags: voyant-ros:pr-${{ github.event.pull_request.number }}

      - name: Record what was built
        run: |
          {
            echo "Built for ${{ matrix.platform }}, not pushed."
            echo "Build digest (local, not a registry digest): ${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: build and push (version tag)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout the tagged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Compute the image tag from the git tag
        id: tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ]; then
            echo "refusing to push: $REF_NAME is a $REF_TYPE, images are pushed for tags only" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "refusing to push: the checkout is not the tagged commit $GITHUB_SHA" >&2
            exit 1
          fi
          # replace "/" with "-", lowercase, and collapse any disallowed characters (as before)
          SAFE_TAG="${REF_NAME//\//-}"
          SAFE_TAG="${SAFE_TAG,,}"
          SAFE_TAG="$(echo "$SAFE_TAG" | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')"
          echo "tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $SAFE_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing image tag
        env:
          IMAGE: ghcr.io/metrolla-inc/voyant-ros:${{ steps.tag.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists; image tags are immutable. Cut a new git tag instead."
            exit 1
          fi
          echo "$IMAGE does not exist yet"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image for amd64 and arm64
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ROS_DISTRO=jazzy
            RMW_IMPLEMENTATION=rmw_fastrtps_cpp
          tags: ghcr.io/metrolla-inc/voyant-ros:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}

      - name: Record the pushed digest
        env:
          IMAGE: ghcr.io/metrolla-inc/voyant-ros:${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" | tee image-digest.txt
          {
            echo "Pushed \`$IMAGE\`"
            echo ""
            echo "Digest: \`$DIGEST\` (pin releases by this digest)"
            echo "Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the digest with the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 90
