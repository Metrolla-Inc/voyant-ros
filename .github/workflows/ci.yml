name: ci

# Three tiers, separately named (TESTING.md): unit, regression, smoke.
# Nothing here logs in to a registry, pushes an image or uses a repository secret.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest==9.0.1 pyyaml==6.0.3 shellcheck-py==0.11.0.1

      - name: Env contract and legacy entrypoint (pytest)
        run: python -m pytest tests/unit tests/legacy -v

      - name: shellcheck (the Metrolla scripts)
        run: shellcheck docker/voyant_entrypoint.sh docker/contract-entrypoint.sh docker/smoke/smoke.sh

      - name: hadolint
        # DL3008/DL3015/DL3003/DL3047/DL4001/DL4006/SC2086 are in the Dockerfile's vendor lines
        # (unpinned apt packages, recommends, cd, wget progress, wget and curl, find | head without
        # pipefail, unquoted ROS_DISTRO), kept as the vendor wrote them.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  $RUNNER_TEMP/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --ignore DL3008 --ignore DL3015 --ignore DL3003 --ignore DL3047 --ignore DL4001 --ignore DL4006 --ignore SC2086 Dockerfile

  regression:
    name: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # the past-bug tests read the released files (main 7e6f9aa)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python -m pip install pytest==9.0.1 pyyaml==6.0.3

      - name: Goldens (legacy entrypoint, contract renders and refusals) and past bugs
        run: python -m pytest tests/regression tests/legacy -v

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build the image (amd64, loaded locally, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: voyant-ros:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke (legacy mode and contract against voyant-api 1.0.1's Carbon simulator)
        run: docker/smoke/smoke.sh voyant-ros:ci
